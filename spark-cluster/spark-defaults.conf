# --- Iceberg ---
spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.iceberg=org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg.type=rest
spark.sql.catalog.iceberg.uri=http://rest:8181
spark.sql.catalog.iceberg.io-impl=org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.iceberg.warehouse=s3://warehouse/
# Update to use existing jars (Iceberg 1.5.2)
# spark.jars.packages is not strictly needed if jars are in $SPARK_HOME/jars
# but ensuring extensions is correct.
spark.sql.defaultCatalog=iceberg

# --- Unified S3 Config ---
spark.hadoop.fs.s3a.access.key=admin
spark.hadoop.fs.s3a.secret.key=password
spark.hadoop.fs.s3a.endpoint=http://minio:9000
spark.hadoop.fs.s3a.path.style.access=true
spark.hadoop.fs.s3a.connection.ssl.enabled=false
spark.sql.catalog.iceberg.s3.endpoint=http://minio:9000

# --- CRITICAL: Multiple ways to set AWS region ---
# Method 1: Iceberg catalog properties
spark.sql.catalog.iceberg.s3.endpoint=http://minio:9000
spark.sql.catalog.iceberg.s3.region=eu-central-1
spark.sql.catalog.iceberg.s3.access-key-id=admin
spark.sql.catalog.iceberg.s3.secret-access-key=password

# Method 2: Java system properties (for AWS SDK v2)
spark.executor.extraJavaOptions=-Daws.region=eu-central-1 -Daws.accessKeyId=admin -Daws.secretAccessKey=password -Dsoftware.amazon.awssdk.regions.region=eu-central-1
spark.driver.extraJavaOptions=-Daws.region=eu-central-1 -Daws.accessKeyId=admin -Daws.secretAccessKey=password -Dsoftware.amazon.awssdk.regions.region=eu-central-1

# Method 3: Hadoop configuration for S3A
spark.hadoop.fs.s3a.region=eu-central-1

# --- CRITICAL: Force Spark to pre-shuffle by partition key ---
# This prevents FanoutDataWriter from holding 1800+ file handles
# With hash distribution, each task only writes to a SUBSET of partitions
spark.sql.iceberg.distribution-mode=hash

# --- Memory Configuration (conservative for compaction stability) ---
spark.sql.shuffle.partitions=4
spark.executor.memory=2g
spark.executor.memoryOverhead=1g
spark.driver.memory=2g
spark.driver.memoryOverhead=512m
spark.memory.fraction=0.6
spark.memory.storageFraction=0.3

# --- Executor cores for parallel tasks (single task to prevent OOM) ---
spark.executor.cores=1

# --- Limit concurrent executors to prevent memory starvation ---
spark.dynamicAllocation.enabled=false
spark.executor.instances=2
spark.task.cpus=1
spark.executor.instances=1
spark.dynamicAllocation.enabled=false

# --- Aggressive GC and memory cleanup ---
spark.cleaner.periodicGC.interval=1min
spark.cleaner.referenceTracking.cleanCheckpoints=true

# --- Adaptive Query Execution ---
spark.sql.adaptive.enabled=true
spark.sql.adaptive.coalescePartitions.enabled=true
spark.sql.adaptive.coalescePartitions.minPartitionSize=1m
spark.sql.autoBroadcastJoinThreshold=10485760